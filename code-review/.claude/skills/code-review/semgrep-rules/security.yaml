# Canonical vendored semgrep ruleset for polyreview (ADR-0016).
# Provenance: hand-authored security rules for the polyreview deterministic
# layer; license: MIT (same as polyreview), no AGPL — satisfies the stack-pins.md
# floor. setup.sh/prefetch_caches.py copy this into cache_root()/cache/semgrep/rules.
# Python rules only — JS/TS rules live in the sibling security-js.yaml (ADR-0016, s3).
rules:
  - id: subprocess-shell-true
    pattern-either:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
    message: >
      subprocess invoked with shell=True is a command-injection risk (CWE-78).
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-78"

  - id: dangerous-eval
    pattern: eval(...)
    message: >
      Use of eval() on potentially untrusted input (CWE-95).
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-95"
