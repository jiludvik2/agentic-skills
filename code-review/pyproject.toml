[project]
name = "polyreview"
version = "0.1.1"
requires-python = ">=3.11"
description = "AI-native code review skill — deterministic analyzer layer"
license = { file = "LICENSE" }
readme = "README.md"
authors = [{ name = "Jiri Ludvik" }]
keywords = [
    "code-review",
    "sarif",
    "static-analysis",
    "semgrep",
    "bandit",
    "sdlc",
    "deterministic-analyzer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.18",
    "jsonschema>=4.26",
    "bandit>=1.7",
    "radon>=6.0",
    "vulture>=2.13",
    "pydeps>=1.12",
    "cohesion>=1.1",
]

[project.urls]
Homepage = "https://github.com/jiludvik2/agentic-skills/tree/main/code-review"
Source = "https://github.com/jiludvik2/agentic-skills"
Issues = "https://github.com/jiludvik2/agentic-skills/issues"

[project.scripts]
polyreview = "code_review.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["code_review"]
include = ["code_review/capabilities.json", "code_review/schemas/*.json"]

# ADR-0018 §2 / s6-t1: mirror the skill-bundle manifest from the canonical on-disk
# bundle (.claude/skills/code-review/) into the package as code_review/_bundle/ so
# `polyreview install` can read it via importlib.resources. force-include references
# the existing files (no committed second copy) and ships only the manifest subset —
# node_modules/, cache/, runs/ are deliberately excluded. Keep in sync with
# code_review/bundle.py BUNDLE_MANIFEST.
[tool.hatch.build.targets.wheel.force-include]
".claude/skills/code-review/SKILL.md" = "code_review/_bundle/SKILL.md"
".claude/skills/code-review/code-review.toml.example" = "code_review/_bundle/code-review.toml.example"
".claude/skills/code-review/package.json" = "code_review/_bundle/package.json"
".claude/skills/code-review/package-lock.json" = "code_review/_bundle/package-lock.json"
".claude/skills/code-review/semgrep-rules" = "code_review/_bundle/semgrep-rules"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires external tools on PATH",
    "slow: takes 30-60s (wheel build + venv install)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Fixtures hold deliberately bad code for analyzers to flag — do not lint them.
extend-exclude = ["tests/fixtures", "sdlc/docs/qa/analyzer-coverage/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer.Option(...) in argument defaults is the framework idiom, not a B008 bug.
"code_review/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["code_review", "tests"]
# Fixtures hold deliberately malformed code for analyzers to flag — do not type-check them.
exclude = "^tests/fixtures/"

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "mypy==1.13.0",
    "ruff==0.15.14",
    "types-jsonschema==4.23.0.20241208",
    "types-PyYAML==6.0.12.20260518",
]
