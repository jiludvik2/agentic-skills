[project]
name = "code-review"
version = "0.1.0"
requires-python = ">=3.11"
description = "AI-native code review skill — deterministic analyzer layer"
license = { text = "MIT" }
dependencies = [
    "typer==0.18.0",
    "jsonschema==4.26.0",
    "bandit==1.7.10",
    "radon==6.0.1",
    "vulture==2.13",
    "pydeps==1.12.20",
    "cohesion==1.1.0",
    "schemathesis==4.0.10",
]

[project.scripts]
code-review = "code_review.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["code_review"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires external tools on PATH"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "mypy==1.13.0",
    "ruff==0.15.14",
]
