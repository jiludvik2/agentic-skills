[project]
name = "polyreview"
version = "0.1.0rc1"
requires-python = ">=3.11"
description = "AI-native code review skill — deterministic analyzer layer"
license = { file = "LICENSE" }
readme = "README.md"
authors = [{ name = "Jiri Ludvik" }]
keywords = [
    "code-review",
    "sarif",
    "static-analysis",
    "semgrep",
    "bandit",
    "sdlc",
    "deterministic-analyzer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.18",
    "jsonschema>=4.26",
    "bandit>=1.7",
    "radon>=6.0",
    "vulture>=2.13",
    "pydeps>=1.12",
    "cohesion>=1.1",
    "schemathesis>=4.0,<5",  # 3→4 was a breaking-change major; re-evaluate before allowing 5.x
]

[project.urls]
Homepage = "https://github.com/jiludvik2/agentic-skills/tree/main/code-review"
Source = "https://github.com/jiludvik2/agentic-skills"
Issues = "https://github.com/jiludvik2/agentic-skills/issues"

[project.scripts]
polyreview = "code_review.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["code_review"]
include = ["code_review/capabilities.json", "code_review/schemas/*.json"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires external tools on PATH",
    "slow: takes 30-60s (wheel build + venv install)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Fixtures hold deliberately bad code for analyzers to flag — do not lint them.
extend-exclude = ["tests/fixtures", "sdlc/docs/qa/analyzer-coverage/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer.Option(...) in argument defaults is the framework idiom, not a B008 bug.
"code_review/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["code_review", "tests"]
# Fixtures hold deliberately malformed code for analyzers to flag — do not type-check them.
exclude = "^tests/fixtures/"

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "mypy==1.13.0",
    "ruff==0.15.14",
    "types-jsonschema==4.23.0.20241208",
    "fastapi==0.136.3",
    "uvicorn==0.34.3",
    "types-PyYAML==6.0.12.20260518",
]
